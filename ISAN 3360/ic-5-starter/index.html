<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IC-5: nav bar + card row</title>
  <!-- This line connects this page to styles.css -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- In-class Exercise #5: look only, except in Step 2. -->

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <!-- Step 2: add class="cards" to the section tag below -->
  <section class="cards">
    <div class="card">One</div>
    <div class="card">Two</div>
    <div class="card">Three</div>
  </section>

  <!-- Step 3: type your <section class="contact-form"> and paste your Google Form iframe inside it below -->
  <section class="contact-form">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf6OEwOhH2j4zHKac65BBAScTxENA3D2FZ13Dl4wTgQ1I0kIw/viewform?embedded=true" width="640" height="669" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
  </section>
</body>
</html>
