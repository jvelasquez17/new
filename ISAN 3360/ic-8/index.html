<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- Bootstrap: ready-made styles for the boxes and buttons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head> 
<body>
    <div class="container py-4">
        <h1>Calculator</h1>
        <!-- New Today: one click switches the page's colors-->
         <button id="theme" class="btn btn-secondary">Dark mode</button>
        <!-- input-group: the boxes and the button in one row -->
    <div class="input-group">
        <input id="a" class="form-control" placeholder="Number A">
        <select id="op" class="form-select">
            <option>+</option>
            <option>-</option>
            <option>*</option>
            <option>/</option>
        </select>
        <input id="b" class="form-control" placeholder="Number B">
        <button id="calc" class="btn btn-primary">Calculate</button>
    </div>

    <p id="result" class="mt-3"></p>

    <hr>
    <h2> Credit Score</h2>
    <div class = "input-group">
        <input id="score" class="form-control" placeholder="Credit score">
        <button id="check" class="btn btn-primary">Check</button>
    </div>

   
    <p id="rating" class="mt-3"></p>
    <h2 class="mt-4">Score Ranges</h2>
    <ul id="ranges"></ul>


    <h2 class="mt-4">Score Factors</h2>
    <ul id="factors"></ul>

    <script src="script.js"></script>
</body>
</html>
